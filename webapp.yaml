
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
        - name: tomcat
          image: peni5/webapp:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: webappdb
              mountPath: /home/webapp/database

      volumes:
        - name: webappdb
          hostPath:
            path: /home/webapp/database
            type: DirectoryOrCreate
