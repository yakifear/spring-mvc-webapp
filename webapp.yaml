apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 2

  # Не запускаем две версии приложения одновременно:
  # обе используют одну директорию базы данных.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: webapp

  template:
    metadata:
      labels:
        app: webapp

    spec:
      containers:
        - name: tomcat
          image: peni5/webapp:v2
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: webappdb
              mountPath: /home/webapp/database

      volumes:
        - name: webappdb
          hostPath:
            path: /home/webapp/database
            type: DirectoryOrCreate